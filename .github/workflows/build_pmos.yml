name: Build postmarketOS for LT m16s

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Packages
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv openssl curl wget xz-utils device-tree-compiler android-tools-adb android-tools-fastboot bmap-tools qemu-user-static binfmt-support build-essential libc6-dev-i386 lib32z1-dev

      - name: Install pmbootstrap (Fallback: Git then Pip)
        run: |
          # الخطة أ: استنساخ من GitLab
          git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git ~/pmbootstrap || \
          # الخطة ب: التثبيت عبر pip (قديم لكن يعمل)
          pip3 install --user pmbootstrap
          
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          if [ -d "$HOME/pmbootstrap" ]; then
            ln -sf ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          fi
          
          pmbootstrap --version

      - name: Configure pmbootstrap
        run: |
          # تهيئة أولية (لإنشاء مجلد pmaports والتكوين الافتراضي)
          yes "" | pmbootstrap init || true
          
          # ضبط الإعدادات باستخدام الأمر الرسمي (يتجنب أخطاء التنسيق اليدوي)
          pmbootstrap config device lt-m16s
          pmbootstrap config kernel lt-mobile-c28
          pmbootstrap config ui phosh
          pmbootstrap config user user
          pmbootstrap config jobs 2
          pmbootstrap config aports "$HOME/.local/var/pmbootstrap/cache_git/pmaports"

      - name: Inject Packages to pmaports
        run: |
          PMAPORTS_DIR="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS_DIR/device/testing"
          cp -r pmos-lt-m16s "$PMAPORTS_DIR/device/testing/device-lt-m16s" || rsync -a pmos-lt-m16s/ "$PMAPORTS_DIR/device/testing/device-lt-m16s/"
          cp -r pmos-linux-lt-mobile-c28 "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28" || rsync -a pmos-linux-lt-mobile-c28/ "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28/"

      - name: Build Kernel Package (Fallback)
        run: |
          # الخطة أ: بناء عادي
          pmbootstrap build --force linux-lt-mobile-c28 || \
          # الخطة ب: بناء مع --lax لتجاوز الوضع الصارم (مدعوم في 3.11+)
          pmbootstrap build --lax --force linux-lt-mobile-c28

      - name: Build Device Package (Fallback)
        run: |
          pmbootstrap build --force device-lt-m16s || \
          pmbootstrap build --lax --force device-lt-m16s

      - name: Generate Images (Fallback)
        run: |
          # الخطة أ: تقسيم مع كلمة مرور
          pmbootstrap install --split --password 147147 || \
          # الخطة ب: تقسيم بدون كلمة مرور
          pmbootstrap install --split || \
          # الخطة ج: تثبيت عادي (ملف واحد)
          pmbootstrap install

      - name: Export Images
        run: |
          pmbootstrap export || true
          mkdir -p output
          cp /tmp/postmarketOS-export/* output/ 2>/dev/null || \
          cp ~/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/*.img output/ 2>/dev/null || true
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-LT-m16s
          path: output/*
