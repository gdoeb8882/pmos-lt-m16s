name: Build postmarketOS for LT m16s

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Packages
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv openssl curl wget xz-utils device-tree-compiler android-tools-adb android-tools-fastboot bmap-tools qemu-user-static binfmt-support build-essential libc6-dev-i386 lib32z1-dev

      - name: Install pmbootstrap (Safe Fallback)
        run: |
          if ! git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git ~/pmbootstrap ; then
            echo "Git clone failed, trying pip install..."
            pip3 install --user pmbootstrap
          fi
          
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          if [ -d "$HOME/pmbootstrap" ]; then
            ln -sf ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          fi
          
          pmbootstrap --version || echo "Warning: pmbootstrap command not found, build may fail."

      - name: Configure pmbootstrap
        run: |
          yes "" | pmbootstrap init || true
          pmbootstrap config device lt-m16s
          pmbootstrap config kernel lt-mobile-c28
          pmbootstrap config ui phosh
          pmbootstrap config user user
          pmbootstrap config jobs 2
          pmbootstrap config aports "$HOME/.local/var/pmbootstrap/cache_git/pmaports"

      - name: Inject Packages to pmaports
        run: |
          PMAPORTS_DIR="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS_DIR/device/testing"
          
          if ! cp -r pmos-lt-m16s "$PMAPORTS_DIR/device/testing/device-lt-m16s"; then
            rsync -a pmos-lt-m16s/ "$PMAPORTS_DIR/device/testing/device-lt-m16s/"
          fi
          
          if ! cp -r pmos-linux-lt-mobile-c28 "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28"; then
            rsync -a pmos-linux-lt-mobile-c28/ "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28/"
          fi

      - name: Build Kernel Package
        run: |
          set +e
          pmbootstrap build --force linux-lt-mobile-c28
          if [ $? -ne 0 ]; then
            echo "Standard build failed. Trying with --lax..."
            pmbootstrap build --lax --force linux-lt-mobile-c28
          fi
          set -e

      - name: Build Device Package
        run: |
          set +e
          pmbootstrap build --force device-lt-m16s
          if [ $? -ne 0 ]; then
            echo "Standard build failed. Trying with --lax..."
            pmbootstrap build --lax --force device-lt-m16s
          fi
          set -e

      - name: Generate Images
        run: |
          set +e
          pmbootstrap install --split --password 147147
          if [ $? -ne 0 ]; then
            echo "Split install with password failed. Trying without password..."
            pmbootstrap install --split
          fi
          if [ $? -ne 0 ]; then
            echo "Split install failed. Trying standard install..."
            pmbootstrap install
          fi
          set -e

      - name: Export Images
        run: |
          pmbootstrap export || true
          mkdir -p output
          cp /tmp/postmarketOS-export/* output/ 2>/dev/null || cp ~/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/*.img output/ 2>/dev/null || true
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-LT-m16s
          path: output/*
