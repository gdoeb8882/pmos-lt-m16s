name: Build postmarketOS for LT C28

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv openssl curl wget xz-utils device-tree-compiler android-tools-adb android-tools-fastboot bmap-tools qemu-user-static binfmt-support build-essential libc6-dev-i386 lib32z1-dev

      - name: Install pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pmbootstrap --version

      - name: Setup pmaports and Config
        run: |
          yes "" | pmbootstrap init
          
          PMAPORTS_DIR="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS_DIR/device/testing"
          cp -r pmos-lt-m16s "$PMAPORTS_DIR/device/testing/device-lt-m16s"
          cp -r pmos-linux-lt-mobile-c28 "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28"
          
          cd "$PMAPORTS_DIR"
          git add -A
          git -c user.email="ci@postmarketos.org" -c user.name="CI" commit -m "Add local device packages for CI build"
          
          pmbootstrap config device lt-m16s
          pmbootstrap config kernel lt-mobile-c28
          pmbootstrap config jobs 2
          pmbootstrap config auto_zap_misconfigured_chroots yes
          pmbootstrap config ui sxmo-de-sway

      - name: Build Kernel and Device
        run: |
          pmbootstrap build --force linux-lt-mobile-c28
          pmbootstrap build --force device-lt-m16s

      - name: Generate Image (mkinitfs Workaround)
        run: |
          set +e
          
          echo "=== Attempt 1: Standard install ==="
          pmbootstrap install --split --password 147147 --no-recommends
          rc=$?
          if [ $rc -eq 0 ]; then echo "Attempt 1 succeeded!"; exit 0; fi
          
          echo "=== Attempt 1 failed. Trying workaround: remove 30-gpu-firmware.files ==="
          sudo rm -f /usr/share/mkinitfs/files/30-gpu-firmware.files || true
          pmbootstrap install --split --password 147147 --no-recommends
          rc=$?
          if [ $rc -eq 0 ]; then echo "Workaround 1 succeeded!"; exit 0; fi
          
          echo "=== Workaround 1 failed. Trying workaround: add mtk-mkimage to rootfs ==="
          pmbootstrap chroot apk fix --rootfs || true
          pmbootstrap chroot apk add mtk-mkimage --rootfs || true
          pmbootstrap chroot apk fix --rootfs || true
          pmbootstrap install --split --password 147147 --no-recommends
          rc=$?
          if [ $rc -eq 0 ]; then echo "Workaround 2 succeeded!"; exit 0; fi
          
          echo "=== All attempts failed. Dumping log ==="
          cat ~/.local/var/pmbootstrap/log.txt | tail -150
          exit 1

      - name: Export Images
        run: |
          pmbootstrap export
          mkdir -p output
          cp /tmp/postmarketOS-export/* output/ || true
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-LT-C28
          path: output/*
