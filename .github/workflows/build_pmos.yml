name: Build postmarketOS for LT m16s

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Packages
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv \
            openssl curl wget xz-utils device-tree-compiler \
            android-tools-adb android-tools-fastboot bmap-tools \
            qemu-user-static binfmt-support build-essential \
            libc6-dev-i386 lib32z1-dev

      - name: Install pmbootstrap from Source
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pmbootstrap --version

      - name: Initialize pmbootstrap (Non-Interactive)
        run: |
          # تشغيل init لتجاوز الأسئلة التفاعلية وتنزيل pmaports
          yes "" | pmbootstrap init || true
          
          # حقن الإعدادات مباشرة في ملف التكوين لتجنب أخطاء الأوامر
          mkdir -p ~/.config
          cat > ~/.config/pmbootstrap_v3.cfg << 'CFG'
[pmbootstrap]
aports = /home/runner/.local/var/pmbootstrap/cache_git/pmaports
device = lt-m16s
extra_packages = halium-libhybris
jobs = 2
kernel = lt-mobile-c28
ui = phosh
user = user
work = /home/runner/.local/var/pmbootstrap
CFG

      - name: Copy Packages to pmaports
        run: |
          PMAPORTS_DIR="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          mkdir -p "$PMAPORTS_DIR/device/testing"
          
          # نسخ الحزم وإعادة تسميتها ليطابقها pmbootstrap
          cp -r pmos-lt-m16s "$PMAPORTS_DIR/device/testing/device-lt-m16s"
          cp -r pmos-linux-lt-mobile-c28 "$PMAPORTS_DIR/device/testing/linux-lt-mobile-c28"

      - name: Build Kernel Package
        run: pmbootstrap build --force linux-lt-mobile-c28

      - name: Build Device Package
        run: pmbootstrap build --force device-lt-m16s

      - name: Generate postmarketOS Images
        run: pmbootstrap install --split --password 147147

      - name: Export Images
        run: |
          pmbootstrap export
          mkdir -p output
          cp /tmp/postmarketOS-export/* output/ || true
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketOS-LT-m16s
          path: output/*
